name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Package application
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SpeedianceFITExporter --paths app app/main.py
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Create Windows Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SpeedianceFITExporter-Windows-Setup-0.1.36-beta
          path: |
            dist/SpeedianceFITExporter-Setup.exe
            README.md
            CHANGELOG.md
            docs/de/
            docs/en/
          if-no-files-found: error
